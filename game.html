<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поле чудес</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="game-container">
        <div class="title">
            <h1>Айтушное Поле Чудес</h1>
            <h2>(пожалуйста, не жалуйтесь правообладателям с телевидения что я взял идею)</h2>
        </div>

        <div class="game-info">
            <p id="hint-display" class="hint">Вопрос загружается...</p>
            <p id="lives-display" class="lives">Осталось жизней: 6</p>
        </div>

        <div id="word-display" class="word-board">_ _ _ _ _</div>

        <div class="input-section">
            <label for="letter-input" class="visually-hidden">Введите букву: </label>
            <input type="text"
                   id="letter-input"
                   maxlength="1"
                   placeholder="Буквааа...!"
                   autocomplete="off">
            <button id="guess-btn" class="btn">Угадать</button>
        </div>

        <p id="message-display" class="message" aria-live="polite"></p>

        <button id="restart-btn" class="btn restart-btn" style="display: none;">Сыграть снова</button>
    </main>

    <script src="js/game.js" defer></script>
</body>
</html>
